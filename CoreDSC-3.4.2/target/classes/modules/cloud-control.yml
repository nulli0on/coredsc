config-version: 6
generated-by-version: "3.4.1"

# Central CoreDSC Operations agent. It opens one outbound TLS WebSocket; no
# listener or public port is created on the customer's Minecraft server.
# Disabled until you deploy the Worker and replace the example.invalid endpoint.
enabled: false
endpoint: 'wss://coredsc.example.invalid/api/v1/agent/connect'
# Empty uses the Bukkit server name. COREDSC_CLOUD_INSTANCE_NAME can override it.
instance-name: ''

transport:
  maximum-queued-frames: 256
  maximum-backoff-seconds: 300

# Local policy is authoritative even when a Discord account has a cloud role.
features:
  moderation: true
  channel: true
  incident: true
  maintenance: true
  event: true
  automod: true
  network: true
  console: true

# Optional Discord channel for incident, maintenance, and network announcements.
# Falls back to the server-events channel where that operation supports it.
operations-channel-id: ''
idempotency-retention-days: 30

incident:
  # Public channels CoreDSC snapshots and locks during Incident Mode.
  channel-ids: []

moderation:
  # Local protection cannot be weakened from the website.
  protected-minecraft-names: []
  protected-minecraft-uuids: []
  protected-discord-user-ids: []
  # Vanilla has no temporary-ban or warn command. Replace these templates with
  # those from your moderation plugin when applicable.
  minecraft-commands:
    ban: 'ban %player% %reason%'
    unban: 'pardon %player%'
    kick: 'kick %player% %reason%'
    timeout: ''
    warn: 'tell %player% [CoreDSC Warning] %reason%'

console:
  remote-execution:
    # Viewing redacted Smart Console incidents does not require this switch.
    # Execution also requires the Console Operator role and two-person approval.
    enabled: false
    allowlisted-commands:
      - list
      - tps
      - mspt
      - say
      - whitelist
