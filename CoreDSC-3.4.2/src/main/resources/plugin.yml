name: CoreDSC
main: com.hubertstudios.coredsc.CoreDSCPlugin
version: 3.4.1
api-version: "1.21"
folia-supported: true
author: HubertStudios
description: Lightweight, modular Minecraft and Discord operations platform.
website: https://hubertstudios.com
softdepend: [AuthMe, LuckPerms, PlaceholderAPI, Vault, voicechat]

commands:
  coredsc:
    description: CoreDSC status, diagnostics, hosted editor, migration, queue and reload
    usage: "/<command> <status|setup|doctor|queue|bot|emit|telemetry|migrate|editor|webeditor|reload>"
  link:
    description: Generates a temporary Discord linking code
    usage: "/link"
    permission: coredsc.link
  unlink:
    description: Unlinks your Minecraft account from Discord
    usage: "/unlink"
    permission: coredsc.unlink
  ticket:
    description: Create and manage support tickets
    usage: "/ticket <create|status|reply|close>"
    permission: coredsc.ticket
  report:
    description: Report a Minecraft player
    usage: "/report <player> <reason> [message]"
    permission: coredsc.report
  case:
    description: Inspect moderation cases
    usage: "/case <view|player|close>"
    permission: coredsc.case.view
  appeal:
    description: Appeal a moderation case
    usage: "/appeal <create|status>"
    permission: coredsc.appeal
  apply:
    description: Create and manage a server application
    usage: "/apply <start|questions|answer|submit|status>"
    permission: coredsc.apply
  application:
    description: Staff application management
    usage: "/application <view|accept|reject>"
    permission: coredsc.application.manage
  lore:
    description: Trigger a configured cinematic Discord NPC persona
    usage: "/lore <profile> <message>"
    permission: coredsc.lore.trigger

permissions:
  coredsc.status:
    description: Allows viewing CoreDSC status
    default: op
  coredsc.reload:
    description: Allows reloading CoreDSC
    default: op
  coredsc.doctor:
    description: Allows CoreDSC diagnostics and safe fixes
    default: op
  coredsc.queue:
    description: Allows inspecting and retrying the Discord delivery queue
    default: op
  coredsc.bot:
    description: Allows managing the optional Python developer worker
    default: op
  coredsc.emit:
    description: Allows publishing configured custom events to Python scripts
    default: op
  coredsc.migrate:
    description: Allows non-destructive migration from supported Discord bridge plugins
    default: op
  coredsc.webeditor:
    description: Allows managing temporary local WebEditor sessions from the server console
    default: op
  coredsc.editor:
    description: Allows opening the hosted CoreDSC Operations dashboard
    default: op
  coredsc.link:
    description: Allows generating a Discord linking code
    default: true
  coredsc.unlink:
    description: Allows unlinking a Discord account
    default: true
  coredsc.link.bypass:
    description: Bypasses mandatory Discord account-link restrictions
    default: op
  coredsc.ticket:
    description: Allows creating and managing own tickets
    default: true
  coredsc.report:
    description: Allows creating and managing own reports
    default: true
  coredsc.report.bypass:
    description: Bypasses report cooldown and limits where supported
    default: op
  coredsc.report.admin:
    description: Opens and manages the configurable report GUI
    default: op
  coredsc.case.view:
    description: Allows viewing moderation cases
    default: op
  coredsc.case.manage:
    description: Allows closing moderation cases
    default: op
  coredsc.appeal:
    description: Allows appealing own moderation cases
    default: true
  coredsc.apply:
    description: Allows creating a server application
    default: true
  coredsc.application.manage:
    description: Allows viewing and deciding applications
    default: op
  coredsc.voice.optout:
    description: Excludes a player from CoreDSC proximity-room grouping and voice relays
    default: false
  coredsc.lore.trigger:
    description: Allows triggering configured Lore Sync NPC broadcasts
    default: op
